<svg xmlns="http://www.w3.org/2000/svg" width="790" height="255" viewBox="0 0 790 255" role="img" aria-labelledby="title desc">
  <title id="title">Cadena RDFS de dos subclases</title>
  <desc id="desc">Ana tiene tipo TeachingAssistant, TeachingAssistant es subclase de Student y Student es subclase de Person.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#386FA4"/></marker></defs>
  <rect x="48" y="35" width="185" height="72" rx="12" fill="#FFF3CD" stroke="#B7791F" stroke-width="2"/>
  <text x="140" y="65" text-anchor="middle" font-family="Arial" font-size="17" fill="#704A00">TeachingAssistant</text><text x="140" y="88" text-anchor="middle" font-family="Arial" font-size="14" fill="#704A00">clase</text>
  <rect x="300" y="35" width="145" height="72" rx="12" fill="#FFF3CD" stroke="#B7791F" stroke-width="2"/>
  <text x="372" y="65" text-anchor="middle" font-family="Arial" font-size="18" fill="#704A00">Student</text><text x="372" y="88" text-anchor="middle" font-family="Arial" font-size="14" fill="#704A00">clase</text>
  <rect x="540" y="35" width="145" height="72" rx="12" fill="#FFF3CD" stroke="#B7791F" stroke-width="2"/>
  <text x="612" y="65" text-anchor="middle" font-family="Arial" font-size="18" fill="#704A00">Person</text><text x="612" y="88" text-anchor="middle" font-family="Arial" font-size="14" fill="#704A00">clase</text>
  <line x1="234" y1="71" x2="298" y2="71" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a)"/><text x="266" y="23" text-anchor="middle" font-family="Arial" font-size="14" fill="#704A00">rdfs:subClassOf</text>
  <line x1="446" y1="71" x2="538" y2="71" stroke="#B7791F" stroke-width="2.5" marker-end="url(#a)"/><text x="492" y="23" text-anchor="middle" font-family="Arial" font-size="14" fill="#704A00">rdfs:subClassOf</text>
  <ellipse cx="140" cy="198" rx="88" ry="34" fill="#E7F0FA" stroke="#386FA4" stroke-width="2"/><text x="140" y="204" text-anchor="middle" font-family="Arial" font-size="18" fill="#183B5B">ex:Ana</text>
  <line x1="140" y1="163" x2="140" y2="109" stroke="#386FA4" stroke-width="2.5" marker-end="url(#a)"/><text x="188" y="142" font-family="Arial" font-size="15" fill="#183B5B">rdf:type</text>
  <text x="394" y="232" text-anchor="middle" font-family="Arial" font-size="15" fill="#444">Consecuencia final: Ana rdf:type Person</text>
</svg>
