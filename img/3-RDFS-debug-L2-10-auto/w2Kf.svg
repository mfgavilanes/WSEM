<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">Error de dirección en subpropiedad RDFS</title>
  <desc id="desc">participatesInCourse está declarada erróneamente como subpropiedad de teaches; Ana usa teaches con C1.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#B13D3D"/></marker></defs>
  <text x="34" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#444">Esquema con error</text>
  <rect x="55" y="52" width="250" height="70" rx="12" fill="#FCE8E6" stroke="#B13D3D" stroke-width="2"/>
  <text x="180" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#7A2020">ex:participatesInCourse</text><text x="180" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#7A2020">propiedad</text>
  <rect x="510" y="52" width="150" height="70" rx="12" fill="#FCE8E6" stroke="#B13D3D" stroke-width="2"/>
  <text x="585" y="82" text-anchor="middle" font-family="Arial" font-size="18" fill="#7A2020">ex:teaches</text><text x="585" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#7A2020">propiedad</text>
  <line x1="307" y1="87" x2="508" y2="87" stroke="#B13D3D" stroke-width="2.5" marker-end="url(#a)"/><text x="407" y="71" text-anchor="middle" font-family="Arial" font-size="16" fill="#7A2020">rdfs:subPropertyOf</text><text x="407" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#B13D3D">dirección invertida</text>
  <line x1="30" y1="155" x2="770" y2="155" stroke="#C9CED6" stroke-width="1.5"/>
  <text x="34" y="185" font-family="Arial" font-size="16" font-weight="bold" fill="#444">Dato</text>
  <ellipse cx="160" cy="225" rx="62" ry="31" fill="#E7F0FA" stroke="#386FA4" stroke-width="2"/><text x="160" y="231" text-anchor="middle" font-family="Arial" font-size="18" fill="#183B5B">ex:Ana</text>
  <ellipse cx="620" cy="225" rx="58" ry="31" fill="#E7F0FA" stroke="#386FA4" stroke-width="2"/><text x="620" y="231" text-anchor="middle" font-family="Arial" font-size="18" fill="#183B5B">ex:C1</text>
  <line x1="224" y1="225" x2="560" y2="225" stroke="#386FA4" stroke-width="2.5" marker-end="url(#a)"/><text x="392" y="210" text-anchor="middle" font-family="Arial" font-size="17" fill="#183B5B">ex:teaches</text>
