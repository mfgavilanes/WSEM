<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290" role="img" aria-labelledby="title desc">
  <title id="title">Error en una cadena de subpropiedad y dominio</title>
  <desc id="desc">La declaración invierte la relación entre teaches y participatesInCourse. Marta usa teaches con C1 y no se derivan ni la superpropiedad ni el tipo Person.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 z" fill="#B13D3D"/></marker></defs>
  <text x="32" y="27" font-family="Arial" font-size="16" font-weight="bold" fill="#444">Esquema con error</text>
  <rect x="50" y="52" width="160" height="70" rx="12" fill="#FCE8E6" stroke="#B13D3D" stroke-width="2"/><text x="130" y="82" text-anchor="middle" font-family="Arial" font-size="18" fill="#7A2020">ex:teaches</text><text x="130" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#7A2020">propiedad</text>
  <rect x="342" y="52" width="245" height="70" rx="12" fill="#FCE8E6" stroke="#B13D3D" stroke-width="2"/><text x="464" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#7A2020">ex:participatesInCourse</text><text x="464" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#7A2020">propiedad</text>
  <rect x="657" y="52" width="125" height="70" rx="12" fill="#FFF3CD" stroke="#B7791F" stroke-width="2"/><text x="720" y="82" text-anchor="middle" font-family="Arial" font-size="18" fill="#704A00">Person</text><text x="720" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#704A00">clase</text>
  <line x1="340" y1="87" x2="212" y2="87" stroke="#B13D3D" stroke-width="2.5" marker-end="url(#a)"/><text x="276" y="42" text-anchor="middle" font-family="Arial" font-size="14" fill="#7A2020">rdfs:subPropertyOf</text><text x="276" y="112" text-anchor="middle" font-family="Arial" font-size="13" fill="#B13D3D">invertida</text>
  <line x1="589" y1="87" x2="655" y2="87" stroke="#386FA4" stroke-width="2.5" marker-end="url(#a)"/><text x="622" y="42" text-anchor="middle" font-family="Arial" font-size="14" fill="#183B5B">rdfs:domain</text>
  <line x1="30" y1="158" x2="810" y2="158" stroke="#C9CED6" stroke-width="1.5"/>
  <text x="32" y="188" font-family="Arial" font-size="16" font-weight="bold" fill="#444">Dato</text>
  <ellipse cx="170" cy="230" rx="70" ry="30" fill="#E7F0FA" stroke="#386FA4" stroke-width="2"/><text x="170" y="236" text-anchor="middle" font-family="Arial" font-size="18" fill="#183B5B">ex:Marta</text>
  <ellipse cx="650" cy="230" rx="58" ry="30" fill="#E7F0FA" stroke="#386FA4" stroke-width="2"/><text x="650" y="236" text-anchor="middle" font-family="Arial" font-size="18" fill="#183B5B">ex:C1</text>
  <line x1="242" y1="230" x2="590" y2="230" stroke="#386FA4" stroke-width="2.5" marker-end="url(#a)"/><text x="416" y="215" text-anchor="middle" font-family="Arial" font-size="17" fill="#183B5B">ex:teaches</text>
</svg>
